framework:
    messenger:
        failure_transport: failed

        transports:
            # Une file par contrainte métier : chaque consommation peut être
            # dimensionnée et redémarrée indépendamment.
            article_publication:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: article_publication
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            page_asset_cleanup:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: page_asset_cleanup
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            appointment_reminders:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: appointment_reminders
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 5
                    multiplier: 2
            emails:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: emails
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 5
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            App\Application\Blog\Workflow\Message\ProcessScheduledArticles: article_publication
            App\Application\Page\Block\Asset\Message\CleanupOrphanedPageImages: page_asset_cleanup
            App\Application\Reservation\Appointment\Reminder\Message\SendAppointmentReminder: appointment_reminders
            Symfony\Component\Mailer\Messenger\SendEmailMessage: emails
