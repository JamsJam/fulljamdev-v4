name: deploydevelop

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  quality:
    name: Tests et lint
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Configurer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, iconv, intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Installer les dependances Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Executer les controles qualite et les tests
        run: make test TEST_OPTIONS=--testdox

  deploy:
    needs: quality
    name: Deployer l'environnement de developpement
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Deployer sur le serveur de test
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          APP_SECRET_SOURCE: ${{ secrets.APP_TEST_SECRET }}
          DATABASE_URL_SOURCE: ${{ secrets.DATABASE_TEST_URL }}
          MAILER_DSN_SOURCE: ${{ secrets.MAILER_TEST_DSN }}
          MESSENGER_TRANSPORT_DSN_SOURCE: ${{ secrets.MESSENGER_TEST_TRANSPORT_DSN }}
        with:
          host: ${{ secrets.APP_SERVER }}
          username: ${{ secrets.APP_USER }}
          password: ${{ secrets.APP_PASS }}
          port: ${{ secrets.APP_PORT }}
          envs: APP_DOMAIN,APP_SECRET_SOURCE,DATABASE_URL_SOURCE,MAILER_DSN_SOURCE,MESSENGER_TRANSPORT_DSN_SOURCE
          script: |
            set -Eeuo pipefail

            PROJECT_DIR="/var/www/${{ secrets.APP_USER }}/test.${APP_DOMAIN}"

            echo "==========[1/9] Verification de la configuration=========="
            for VARIABLE_NAME in APP_DOMAIN APP_SECRET_SOURCE DATABASE_URL_SOURCE MAILER_DSN_SOURCE MESSENGER_TRANSPORT_DSN_SOURCE; do
              if [ -z "${!VARIABLE_NAME:-}" ]; then
                echo "Erreur : ${VARIABLE_NAME} est absente ou vide." >&2
                exit 1
              fi
            done

            echo "==========[2/9] Acces au dossier du projet=========="
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Erreur : ${PROJECT_DIR} n'est pas un depot Git." >&2
              exit 1
            fi
            cd "$PROJECT_DIR"

            echo "==========[3/9] Recuperation de develop=========="
            git fetch --prune origin develop
            git checkout -B develop origin/develop
            git reset --hard origin/develop

            echo "==========[4/9] Creation de la configuration Symfony=========="
            dotenv_quote() {
              php -r 'echo json_encode($argv[1], JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE);' "$1"
            }

            cat > .env.local <<EOF
            APP_ENV=prod
            APP_DEBUG=0
            DATABASE_URL=$(dotenv_quote "$DATABASE_URL_SOURCE")
            APP_SECRET=$(dotenv_quote "$APP_SECRET_SOURCE")
            MAILER_DSN=$(dotenv_quote "$MAILER_DSN_SOURCE")
            MESSENGER_TRANSPORT_DSN=$(dotenv_quote "$MESSENGER_TRANSPORT_DSN_SOURCE")
            EOF
            chmod 600 .env.local
            rm -f .env.local.php

            echo "==========[5/9] Validation et installation Composer=========="
            composer validate --no-check-publish
            composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist
            composer dump-env prod

            echo "==========[6/9] Nettoyage du cache=========="
            APP_ENV=prod APP_DEBUG=0 php bin/console cache:clear --no-warmup

            echo "==========[7/9] Execution des migrations=========="
            APP_ENV=prod APP_DEBUG=0 php bin/console doctrine:migrations:migrate --no-interaction

            echo "==========[8/9] Compilation des assets=========="
            APP_ENV=prod APP_DEBUG=0 php bin/console sass:build
            APP_ENV=prod APP_DEBUG=0 php bin/console asset-map:compile

            echo "==========[9/9] Rechauffement du cache=========="
            APP_ENV=prod APP_DEBUG=0 php bin/console cache:warmup

            echo "Deploiement de develop termine avec succes."
